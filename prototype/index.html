<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Your Business – Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* ===== THEME TOKENS – replace with the Single Window brand values ===== */
  --font:'IBM Plex Sans Arabic','Noto Sans Arabic',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --bg:#f5f6f8; --card:#fff; --ink:#14181f; --muted:#5d6675; --line:#e2e6ec;
  --brand:#0f6b5c; --brand-ink:#fff; --brand-soft:#e3f3ef; --warn:#b45309; --warn-soft:#fdf1e0;
  --ai:#5b3fd1; --ai-soft:#efeafc; --ok:#17803d; --radius:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0f1319; --card:#171c24; --ink:#eef1f5; --muted:#9aa5b5; --line:#262d38;
  --brand:#3cb89f; --brand-ink:#04211b; --brand-soft:#16312c; --warn:#f0a95a; --warn-soft:#33270f;
  --ai:#a994ff; --ai-soft:#25203f; --ok:#4cc38a;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--font)}
button{font:inherit;color:inherit;cursor:pointer}
.app{max-width:1180px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px;min-height:100vh}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
h1{font-size:18px;margin:0}
.toggle{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.toggle button{border:0;background:none;padding:6px 14px;border-radius:999px;color:var(--muted)}
.toggle button[aria-pressed=true]{background:var(--brand);color:var(--brand-ink)}
.stepper{display:flex;gap:6px;flex-wrap:wrap}
.step{flex:1;min-width:110px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:13px;text-align:start}
.step b{display:block;color:var(--ink);font-size:13px}
.step.on{border-color:var(--brand);background:var(--brand-soft)}
.step.on b{color:var(--brand)}
.step:disabled{opacity:.5;cursor:default}
.layout{display:grid;grid-template-columns:1fr 330px;gap:14px;align-items:start;flex:1}
@media(max-width:900px){.layout{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
h2{margin:0 0 4px;font-size:20px}
.sub{color:var(--muted);margin:0 0 16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tile{text-align:start;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:6px;transition:.15s}
.tile:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.tile .ic{font-size:30px}
.tile h3{margin:0;font-size:16px}
.tile p{margin:0;color:var(--muted);font-size:13px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--brand-soft);color:var(--brand)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.ai{background:var(--ai-soft);color:var(--ai)}
.row{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row input[type=checkbox]{width:18px;height:18px;margin-top:3px;accent-color:var(--brand)}
.row .grow{flex:1}
.row .t{font-weight:600}
.row .d{color:var(--muted);font-size:13px}
.price{white-space:nowrap;text-align:end;font-size:13px;color:var(--muted)}
.price b{display:block;color:var(--ink);font-size:14px}
.group{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 2px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:600}
.btn.ai{background:var(--ai-soft);color:var(--ai);border-color:transparent}
.btn.sm{padding:4px 10px;font-size:13px}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.expl{margin:8px 0 0;padding:10px 12px;border-radius:10px;background:var(--ai-soft);font-size:13px}
.expl b{color:var(--ai)}
.field{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
input[type=text],button{font-family:inherit}
input[type=text]{flex:1;min-width:180px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.side{display:flex;flex-direction:column;gap:14px;position:sticky;top:12px}
@media(max-width:900px){.side{position:static}}
.sum div{display:flex;justify-content:space-between;padding:4px 0;font-size:14px}
.sum .big{font-size:18px;font-weight:700;border-top:1px solid var(--line);margin-top:6px;padding-top:8px}
.save{color:var(--ok);font-size:13px;margin-top:6px}
.ai-panel h3{margin:0 0 8px;font-size:15px;color:var(--ai)}
.sugg{display:flex;flex-direction:column;gap:6px}
.sugg button{text-align:start;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 10px;font-size:13px}
.sugg button:hover{border-color:var(--ai)}
.chat{max-height:220px;overflow:auto;display:flex;flex-direction:column;gap:6px;margin:10px 0}
.msg{padding:7px 10px;border-radius:10px;font-size:13px;max-width:92%}
.msg.u{align-self:flex-end;background:var(--brand-soft)}
.msg.a{background:var(--ai-soft)}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:start}
th{color:var(--muted);font-weight:600}
.banner{background:var(--warn-soft);color:var(--warn);padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:14px}
.timeline{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.tl{display:flex;gap:10px;align-items:center}
.bar{height:10px;border-radius:5px;background:var(--brand);}
.bar.seq{background:var(--warn)}
.done{text-align:center;padding:30px 10px}
.done .ic{font-size:54px}
[dir=rtl] .back-arrow{display:inline-block;transform:scaleX(-1)}
.lang{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:600}
.hd{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
footer{color:var(--muted);font-size:12px;text-align:center;padding:6px}
</style>
</head>

 rFill:["Done (demo): 14 form fields filled from your profile – owner name, ID, address, contact. 2 fields need you: lease number and expected staff count.","تم (تجريبي): ملء 14 حقلًا من ملفك: اسم المالك والهوية والعنوان والتواصل. حقلان يحتاجان منك: رقم عقد الإيجار وعدد الموظفين المتوقع."],

 rDraft:["Draft ready (demo). I built it from your activities and menu/product list – review the 3 highlighted sections before signing.","المسودة جاهزة (تجريبي). أعددتها من أنشطتك وقائمة المنتجات، راجع الأقسام الثلاثة المظللة قبل التوقيع."],
 rLeft:["You still have {o} rule(s) to confirm. I can auto-verify {v} of them for you – use “Auto-check” on the Rules step.","لا تزال لديك {o} قاعدة بحاجة إلى تأكيد. يمكنني التحقق تلقائيًا من {v} منها، استخدم «تحقق تلقائي» في خطوة القواعد."]
};

const S={lang:"en",mode:"new",step:0,biz:null,sel:new Set(),ok:new Set(),expl:new Set(),addr:"",zoneRes:null,chat:[],done:false,ref:0};
const $=s=>document.querySelector(s);
const L=()=>S.lang==="ar"?1:0;
const x=v=>v[L()];                       // pick language from [en, ar]
const u=(k,o={})=>{let s=UI[k][L()];for(const p in o)s=s.replace("{"+p+"}",o[p]);return s;};
const b=()=>BIZ[S.biz];
const acts=()=>b().acts.filter(a=>S.sel.has(a.id));
const rules=()=>b().rules.filter(r=>S.sel.has(r.a));
const fees=()=>acts().reduce((s,a)=>s+a.fee,0);
const seqDays=()=>acts().reduce((s,a)=>s+a.days,0);
const parDays=()=>Math.max(0,...acts().map(a=>a.days))+2;
const arrow=()=>`<span class="back-arrow">←</span>`;   // flipped automatically in RTL via CSS
const fwd=()=>S.lang==="ar"?"←":"→";

function pick(k){ if(BIZ[k].soon)return; S.biz=k;S.sel=new Set(BIZ[k].acts.filter(a=>a.req).map(a=>a.id));S.ok=new Set();S.expl=new Set();S.zoneRes=null;S.chat=[];S.done=false;S.step=1;render();}
function go(n){S.step=n;render();}
function reset(){S.biz=null;S.step=0;S.done=false;render();}

function aiReply(q,key){
  const l=q.toLowerCase();
  if(!S.biz) return u("r0");
  if(key===0||/name|اسم|أسماء/.test(l)) return u("rName");
  if(key===1||/fill|form|املأ|نماذج/.test(l)) return u("rFill");
  if(/cost|fee|تكلف|رسوم/.test(l)) return u("rCost",{f:fees(),n:x([...acts()].sort((a,c)=>c.fee-a.fee)[0].n)});
  if(/long|time|day|وقت|يوم|مدة/.test(l)) return u("rTime",{p:parDays(),s:seqDays()});
  if(key===2||/plan|policy|draft|generate|خطة|سياسة|مسودة|اكتب|أنشئ/.test(l)) return u("rDraft");
  return u("rLeft",{o:rules().filter(r=>!S.ok.has(r.id)).length,v:rules().filter(r=>r.ai&&!S.ok.has(r.id)).length});
}
function ask(q,key){ if(!q.trim())return; S.chat.push({u:1,t:q}); S.chat.push({t:aiReply(q,key)}); renderSide(); const c=$('.chat'); if(c)c.scrollTop=1e9;}

function render(){
  document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==="ar"?"rtl":"ltr";document.title=u("title")+" – "+u("proto");
  const app=$('#app');
  app.innerHTML=`
  <header>
    <h1>🏁 ${u("title")} <span class="chip ai">${u("proto")}</span></h1>
    <div class="hd"><button class="lang" id="lang">${u("lang")}</button>
    <div class="toggle" role="group">
      <button aria-pressed="${S.mode==='today'}" data-m="today">${u("today")}</button>
      <button aria-pressed="${S.mode==='new'}" data-m="new">${u("prop")}</button>
    </div></div>
  </header>
  ${S.mode==='new'?`<nav class="stepper">${UI.steps.map((s,i)=>`<button class="step ${S.step===i?'on':''}" data-s="${i}" ${(i>0&&!S.biz)?'disabled':''}><b>${i+1}. ${x(s)}</b>${x(UI.stepsSub[i])}</button>`).join('')}</nav>`:''}
  <div class="layout"><main class="card" id="main"></main><aside class="side" id="side"></aside></div>
  <footer>${u("foot")}</footer>`;
  $('#lang').onclick=()=>{S.lang=S.lang==="ar"?"en":"ar";S.zoneRes=null;S.chat=[];render();};
  app.querySelectorAll('[data-m]').forEach(e=>e.onclick=()=>{S.mode=e.dataset.m;render();});
  app.querySelectorAll('[data-s]').forEach(e=>e.onclick=()=>go(+e.dataset.s));
  S.mode==='today'?renderToday():renderMain();
  renderSide();
}

function renderToday(){
  $('#main').innerHTML=`<div class="banner">${u("tBanner")}</div>
  <h2>${u("tH")}</h2><p class="sub">${u("tSub")}</p>
  <div class="field"><input type="text" id="q" placeholder="${u("tSearch")}"></div>
  <div id="list"></div><p class="sub" style="margin-top:14px">${u("tProb")}</p>`;
  const draw=v=>$('#list').innerHTML=`<table><tr><th>${u("tAct")}</th><th></th></tr>`+TODAY_LIST.filter(t=>x(t).toLowerCase().includes(v.toLowerCase())).map(t=>`<tr><td>${x(t)}</td><td><button class="btn sm">${u("add")}</button></td></tr>`).join('')+`</table>`;
  draw('');$('#q').oninput=e=>draw(e.target.value);
}

function renderMain(){
  const m=$('#main');
  if(S.step===0){
    m.innerHTML=`<h2>${u("chH")}</h2><p class="sub">${u("chSub")}</p>
    <div class="tiles">${Object.entries(BIZ).map(([k,v])=>`<button class="tile" data-k="${k}" ${v.soon?'style="opacity:.55"':''}><span class="ic">${v.ic}</span><h3>${x(v.name)}</h3><p>${x(v.tag)}</p><div class="meta">${v.soon?`<span class="chip warn">${u("soon")}</span>`:`<span class="chip">${v.acts.length} ${u("bundled")}</span><span class="chip ai">${u("aiAs")}</span>`}</div></button>`).join('')}</div>`;
    m.querySelectorAll('[data-k]').forEach(e=>e.onclick=()=>pick(e.dataset.k));
  }
  if(S.step===1){
    const req=b().acts.filter(a=>a.req),opt=b().acts.filter(a=>!a.req);
    const row=a=>`<label class="row"><input type="checkbox" data-a="${a.id}" ${S.sel.has(a.id)?'checked':''} ${a.req?'disabled':''}><div class="grow"><div class="t">${x(a.n)} ${a.req?`<span class="chip">${u("reqd")}</span>`:''}</div><div class="d">${x(a.d)}</div></div><div class="price"><b>${a.fee}</b>${a.days} ${u("days")}</div></label>`;
    m.innerHTML=`<h2>${b().ic} ${x(b().name)}</h2><p class="sub">${u("bSub")}</p>
    <div class="group">${u("incl")}</div>${req.map(row).join('')}<div class="group">${u("optn")}</div>${opt.map(row).join('')}
    <div class="actions"><button class="btn" id="back">${arrow()} ${u("chg")}</button><button class="btn primary" id="next">${u("toRules")} ${fwd()}</button></div>`;
    m.querySelectorAll('[data-a]').forEach(e=>e.onchange=()=>{e.checked?S.sel.add(e.dataset.a):S.sel.delete(e.dataset.a);renderSide();});
    $('#back').onclick=reset;$('#next').onclick=()=>go(2);
  }
  if(S.step===2){
    const rs=rules();const zr=rs.some(r=>r.zone);
    m.innerHTML=`<h2>${u("rH")}</h2><p class="sub">${u("rSub")}</p>
    ${zr?`<div class="field"><input type="text" id="addr" placeholder="${u("addr")}" value="${S.addr}"><button class="btn ai" id="zone">${u("zone")}</button></div>${S.zoneRes?`<div class="expl" style="margin:0 0 8px">${S.zoneRes}</div>`:''}`:''}
    <div class="actions" style="margin:0 0 6px"><span style="color:var(--muted)">${rs.filter(r=>S.ok.has(r.id)).length}/${rs.length} ${u("conf")}</span><button class="btn ai sm" id="auto">${u("auto")}</button></div>
    ${rs.map(r=>`<div class="row"><input type="checkbox" data-r="${r.id}" ${S.ok.has(r.id)?'checked':''}><div class="grow"><div class="t">${x(r.t)}</div><div class="d">${x(r.reg)} ${r.ai?`<span class="chip ai">${u("aiv")}</span>`:`<span class="chip warn">${u("needs")}</span>`}</div>
    <button class="btn sm" data-e="${r.id}" style="margin-top:6px">${S.expl.has(r.id)?u("hide"):u("expl")}</button>${S.expl.has(r.id)?`<div class="expl"><b>${u("aiw")}</b> ${x(r.p)}</div>`:''}</div></div>`).join('')}
    <div class="actions"><button class="btn" id="back">${arrow()} ${u("bk1")}</button><button class="btn primary" id="next">${u("toLaunch")} ${fwd()}</button></div>`;
    m.querySelectorAll('[data-r]').forEach(e=>e.onchange=()=>{e.checked?S.ok.add(e.dataset.r):S.ok.delete(e.dataset.r);renderMain();renderSide();});
    m.querySelectorAll('[data-e]').forEach(e=>e.onclick=()=>{const k=e.dataset.e;S.expl.has(k)?S.expl.delete(k):S.expl.add(k);renderMain();});
    $('#auto').onclick=()=>{rs.filter(r=>r.ai).forEach(r=>S.ok.add(r.id));renderMain();renderSide();};
    if(zr){$('#zone').onclick=()=>{S.addr=$('#addr').value.trim();S.zoneRes=S.addr?u("zOk",{a:S.addr}):u("zNo");if(S.addr)rs.filter(r=>r.zone).forEach(r=>S.ok.add(r.id));renderMain();};}
    $('#back').onclick=()=>go(1);$('#next').onclick=()=>go(3);
  }
  if(S.step===3){
    if(S.done){m.innerHTML=`<div class="done"><div class="ic">🎉</div><h2>${u("dH")}</h2><p class="sub">${u("dSub",{n:S.ref})}</p><button class="btn primary" id="again">${u("again")}</button></div>`;$('#again').onclick=reset;return;}
    const rs=rules(),left=rs.filter(r=>!S.ok.has(r.id));const mx=seqDays();
    m.innerHTML=`<h2>${u("lH")}</h2><p class="sub">${u("lSub",{b:x(b().name),a:acts().length,r:rs.length})}</p>
    ${left.length?`<div class="banner">${u("lWarn",{n:left.length})}</div>`:''}
    <div class="group">${u("lTime")}</div>
    <div class="timeline"><div class="tl"><span style="width:90px">${u("lB")}</span><div class="bar" style="width:${parDays()/mx*100}%"></div><span>${parDays()} ${u("d")}</span></div>
    <div class="tl"><span style="width:90px">${u("lT")}</span><div class="bar seq" style="width:100%"></div><span>${mx} ${u("d")}</span></div></div>
    <div class="group">${u("lWhat")}</div>
    <table>${acts().map(a=>`<tr><td>${x(a.n)}</td><td style="text-align:end">${a.fee}</td></tr>`).join('')}</table>
    <div class="actions"><button class="btn" id="back">${arrow()} ${u("bk2")}</button><button class="btn primary" id="go">${u("submit")}</button></div>`;
    $('#back').onclick=()=>go(2);$('#go').onclick=()=>{S.done=true;S.ref=Math.floor(Math.random()*9000+1000);renderMain();};
  }
}

function renderSide(){
  const s=$('#side');
  if(S.mode==='today'){s.innerHTML=`<div class="card"><h3 style="margin:0 0 6px">${u("tSel")}</h3><p class="sub">${u("tNone")}</p></div>`;return;}
  let sum='';
  if(S.biz&&S.step>0){
    const sd=seqDays(),pd=parDays();
    sum=`<div class="card sum"><h3 style="margin:0 0 8px">${b().ic} ${u("pack")}</h3>
    <div><span>${u("sA")}</span><b>${acts().length}</b></div><div><span>${u("sR")}</span><b>${rules().length}</b></div>
    <div><span>${u("sT")}</span><b>${pd} ${u("days")}</b></div><div class="big"><span>${u("sF")}</span><b>${fees()}</b></div>
    <div class="save">${u("save",{n:Math.max(0,sd-pd)})}</div></div>`;
  }
  const sugg=S.biz?b().ai:UI.gs;
  s.innerHTML=sum+`<div class="card ai-panel"><h3>${u("aiH")}</h3><div class="sugg">${sugg.map((t,i)=>`<button data-i="${i}">${x(t)}</button>`).join('')}</div>
  <div class="chat">${S.chat.map(c=>`<div class="msg ${c.u?'u':'a'}">${c.t}</div>`).join('')}</div>
  <div class="field" style="margin:0"><input type="text" id="ci" placeholder="${u("ask")}"><button class="btn primary sm" id="cs">${u("send")}</button></div></div>`;
  s.querySelectorAll('[data-i]').forEach(e=>e.onclick=()=>ask(x(sugg[+e.dataset.i]),S.biz?+e.dataset.i:-1));
  $('#cs').onclick=()=>ask($('#ci').value,-1);
  $('#ci').onkeydown=e=>{if(e.key==='Enter')ask(e.target.value,-1);};
}
render();
</script>
</body>
</html>
