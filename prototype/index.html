<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Your Business – Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* ===== THEME TOKENS – Single Window brand ===== */
  --font:'Inter','Tajawal','Noto Sans Arabic',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --primary-color:#07366F; --secondary-color:#204B87; --accent-color:#4386C5; --button-color:#204781;
  --background-color:#FFFFFF; --border-color:#D2D2D2; --text-color:#666666;
  --hero:linear-gradient(90deg,#07366F 0%,#204B87 60%,#4386C5 100%);
  /* derived */
  --bg:#f3f6fa; --card:var(--background-color); --ink:#1c2533; --muted:var(--text-color); --line:var(--border-color);
  --brand:var(--button-color); --brand-ink:#fff; --brand-soft:#e6eef8; --warn:#b45309; --warn-soft:#fdf1e0;
  --ai:var(--primary-color); --ai-soft:#e8f1fa; --ok:#17803d; --radius:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0c1522; --card:#13202f; --ink:#eef2f7; --muted:#a3b0c2; --line:#2a3a50;
  --brand:#4386C5; --brand-ink:#04121f; --brand-soft:#17304c; --warn:#f0a95a; --warn-soft:#33270f;
  --ai:#8fbdea; --ai-soft:#183049; --ok:#4cc38a;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--font)}
button{font:inherit;color:inherit;cursor:pointer}
.app{max-width:1180px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px;min-height:100vh}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
h1{font-size:18px;margin:0}
.toggle{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.toggle button{border:0;background:none;padding:6px 14px;border-radius:999px;color:var(--muted)}
.toggle button[aria-pressed=true]{background:var(--brand);color:var(--brand-ink)}
.stepper{display:flex;gap:6px;flex-wrap:wrap}
.step{flex:1;min-width:110px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:13px;text-align:start}
.step b{display:block;color:var(--ink);font-size:13px}
.step.on{border-color:var(--brand);background:var(--brand-soft)}
.step.on b{color:var(--brand)}
.step:disabled{opacity:.5;cursor:default}
.layout{display:grid;grid-template-columns:1fr 330px;gap:14px;align-items:start;flex:1}
@media(max-width:900px){.layout{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
h2{margin:0 0 4px;font-size:20px}
.sub{color:var(--muted);margin:0 0 16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tile{text-align:start;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:6px;transition:.15s}
.tile:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.tile .ic{font-size:30px}
.tile h3{margin:0;font-size:16px}
.tile p{margin:0;color:var(--muted);font-size:13px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--brand-soft);color:var(--brand)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.ai{background:var(--ai-soft);color:var(--ai)}
.row{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row input[type=checkbox]{width:18px;height:18px;margin-top:3px;accent-color:var(--brand)}
.row .grow{flex:1}
.row .t{font-weight:600}
.row .d{color:var(--muted);font-size:13px}
.price{white-space:nowrap;text-align:end;font-size:13px;color:var(--muted)}
.price b{display:block;color:var(--ink);font-size:14px}
.group{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 2px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:600}
.btn.ai{background:var(--ai-soft);color:var(--ai);border-color:transparent}
.btn.sm{padding:4px 10px;font-size:13px}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.expl{margin:8px 0 0;padding:10px 12px;border-radius:10px;background:var(--ai-soft);font-size:13px}
.expl b{color:var(--ai)}
.field{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
input[type=text],button{font-family:inherit}
input[type=text]{flex:1;min-width:180px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.side{display:flex;flex-direction:column;gap:14px;position:sticky;top:12px}
@media(max-width:900px){.side{position:static}}
.sum div{display:flex;justify-content:space-between;padding:4px 0;font-size:14px}
.sum .big{font-size:18px;font-weight:700;border-top:1px solid var(--line);margin-top:6px;padding-top:8px}
.save{color:var(--ok);font-size:13px;margin-top:6px}
.ai-panel h3{margin:0 0 8px;font-size:15px;color:var(--ai)}
.sugg{display:flex;flex-direction:column;gap:6px}
.sugg button{text-align:start;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 10px;font-size:13px}
.sugg button:hover{border-color:var(--ai)}
.chat{max-height:220px;overflow:auto;display:flex;flex-direction:column;gap:6px;margin:10px 0}
.msg{padding:7px 10px;border-radius:10px;font-size:13px;max-width:92%}
.msg.u{align-self:flex-end;background:var(--brand-soft)}
.msg.a{background:var(--ai-soft)}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:start}
th{color:var(--muted);font-weight:600}
.banner{background:var(--warn-soft);color:var(--warn);padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:14px}
.timeline{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.tl{display:flex;gap:10px;align-items:center}
.bar{height:10px;border-radius:5px;background:var(--brand);}
.bar.seq{background:var(--warn)}
.done{text-align:center;padding:30px 10px}
.done .ic{font-size:54px}
[dir=rtl] .back-arrow{display:inline-block;transform:scaleX(-1)}
.lang{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:600}
.hd{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
header.hero{background:var(--hero);color:#fff;border-radius:var(--radius);padding:18px 20px}
header.hero h1{color:#fff;font-size:20px}
header.hero .chip{background:rgba(255,255,255,.18);color:#fff}
header.hero .lang{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.4)}
header.hero .toggle{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.4)}
header.hero .toggle button{color:#dbe7f5}
header.hero .toggle button[aria-pressed=true]{background:#fff;color:var(--primary-color)}
.step.on b{color:var(--primary-color)}
footer{color:var(--muted);font-size:12px;text-align:center;padding:6px}

/* ===== portal shell ===== */
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.ribbon{background:var(--primary-color);color:#fff;font-size:12.5px;text-align:center;padding:5px 12px}
.top{background:#0a2547;color:#cdd9ea;font-size:13px}
.top .wrap{display:flex;justify-content:space-between;align-items:center;min-height:38px;flex-wrap:wrap;gap:8px}
.top .l,.top .r{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.top a{cursor:pointer}.top a:hover{color:#fff}
.top .toggle{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.3)}
.top .toggle button{color:#cdd9ea;padding:3px 10px;font-size:12px}
.top .toggle button[aria-pressed=true]{background:#fff;color:var(--primary-color)}
.top .lang{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.3);padding:3px 12px;font-size:12px}
header.main{display:block;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header.main .wrap{display:flex;align-items:center;gap:24px;min-height:68px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--primary-color);cursor:pointer}
.logo .mark{width:34px;height:34px;border-radius:9px;background:var(--hero);display:grid;place-items:center;color:#fff}
nav.menu{display:flex;gap:22px;margin-inline-start:auto;font-weight:600;font-size:14.5px;flex-wrap:wrap}
nav.menu a{padding:22px 0;border-bottom:3px solid transparent;cursor:pointer;color:var(--ink)}
nav.menu a.on,nav.menu a:hover{color:var(--accent-color);border-color:var(--accent-color)}
.bn{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:9px;background:#c0392b;color:#fff;font-size:11px;padding:0 5px;margin-inline-start:4px}
.bell{background:none;border:0;font-size:20px;position:relative}
.hero{background:var(--hero);color:#fff;padding:44px 0 56px}
.hero h1{font-size:36px;line-height:1.2;margin:0 0 10px;color:#fff}
.hero p{font-size:17px;color:#dbe7f5;margin:0 0 22px;max-width:680px}
.ask{display:flex;gap:8px;background:var(--card);border-radius:12px;padding:8px;max-width:760px}
.ask input{border:0;background:none;flex:1;font:inherit;font-size:16px;padding:8px 10px;color:var(--ink);outline:0;min-width:0}
.ex{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.ex button{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:4px 12px;font-size:13px}
.intent{background:var(--card);color:var(--ink);border-radius:12px;padding:14px 16px;margin-top:14px;max-width:760px}
.sec{padding:28px 0 4px}.sec h2{font-size:22px;margin:0 0 4px}
.stage{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:12px 0}
.stage button{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:var(--radius);border:1px solid var(--line);background:var(--card);text-align:start}
.stage button.on{border-color:var(--accent-color);background:var(--brand-soft)}
.stage button:not(.on){opacity:.6}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.fc{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);padding:16px;display:flex;flex-direction:column;gap:6px}
.fc h3{margin:0;font-size:16px}.fc p{margin:0;color:var(--muted);font-size:13.5px;flex:1}
.pg{padding:20px 0 30px}
.ov{position:fixed;inset:0;background:rgba(7,22,45,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.ov.on{display:flex}
.modal{background:var(--card);border-radius:14px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:20px}
.modal .mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.modal h3{margin:0}
.x{border:0;background:none;font-size:20px}
.opt{display:block;width:100%;text-align:start;margin:6px 0;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.opt:hover{border-color:var(--accent-color)}
.pbar{height:6px;border-radius:3px;background:var(--line);margin:8px 0 14px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--hero)}
.toast{position:fixed;bottom:18px;inset-inline:0;margin:auto;width:max-content;max-width:90vw;background:#0a2547;color:#fff;padding:9px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:60}
.toast.on{opacity:1}
.mapw{display:grid;grid-template-columns:1fr 320px;gap:14px}
@media(max-width:900px){.mapw{grid-template-columns:1fr}}
.map{direction:ltr;width:100%;background:#dcebf5;border-radius:12px}
.map g{cursor:pointer}
.zinfo b{font-size:17px}
.st{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:600}
.st.ok{background:#e4f4ec;color:#17803d}.st.cond{background:var(--warn-soft);color:var(--warn)}.st.no{background:#fbe6e6;color:#b42318}
.doc{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.doc:first-of-type{border-top:0}.doc .grow{flex:1;min-width:180px}
.pf{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.pf:first-of-type{border-top:0}.pf .grow{flex:1}
.score{font-size:34px;font-weight:700;color:var(--primary-color)}
.dots{display:flex;gap:4px;margin-top:6px}.dots i{flex:1;height:6px;border-radius:3px;background:var(--line)}.dots i.f{background:var(--accent-color)}.dots i.w{background:#c0392b}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tl span:last-child{white-space:nowrap}
.dev{margin-top:14px;border:1px solid var(--line);border-inline-start:4px solid var(--accent-color);border-radius:10px;background:var(--card);padding:10px 14px;direction:ltr;text-align:left;font-size:14px}
.dev summary{cursor:pointer;font-weight:700;color:var(--primary-color)}
.dev h4{margin:14px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.dev p{margin:0}.dev ul,.dev ol{margin:0;padding-inline-start:20px}.dev li{margin:3px 0}
.dev pre,.devpage pre{background:#0a2547;color:#dbe7f5;padding:12px;border-radius:8px;overflow:auto;font-size:12.5px;line-height:1.5;direction:ltr;text-align:left;margin:0}
.dchips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:14px}.dg3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:800px){.dg,.dg3{grid-template-columns:1fr}}
.devpage{direction:ltr;text-align:left}
.arch{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.ab{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}.ab b{display:block}.ab small{color:var(--muted)}
.ab.hl{border-color:var(--accent-color);background:var(--brand-soft)}
.dl li{margin:4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:800px){.grid2{grid-template-columns:1fr}}
select{padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
</style>
</head>
<body>
<div id="root"></div><div class="ov" id="ov"></div><div class="toast" id="toast"></div>
<script>
// ---------- Sample data (illustrative only – NOT real fees or regulations). Each text is [English, Arabic] ----------
const BIZ = {
  cafe:{ic:"☕",name:["Open your café","افتح مقهاك"],tag:["Coffee shop, bakery items, seating area","مقهى، مخبوزات، منطقة جلوس"],
    acts:[
      {id:"c1",n:["Food & beverage retail (café)","بيع الأغذية والمشروبات (مقهى)"],d:["Core commercial activity","النشاط التجاري الأساسي"],req:1,fee:300,days:3},
      {id:"c2",n:["Fresh-food handling & preparation","تداول وتجهيز الأغذية الطازجة"],d:["Required to prepare food on site","مطلوب لتحضير الطعام في الموقع"],req:1,fee:180,days:4},
      {id:"c3",n:["Commercial premises lease registration","تسجيل عقد إيجار المحل التجاري"],d:["Registers the shop location","يسجّل موقع المحل"],req:1,fee:120,days:2},
      {id:"c4",n:["Outdoor seating permit","تصريح الجلوس الخارجي"],d:["Tables on pavement / terrace","طاولات على الرصيف أو الشرفة"],fee:90,days:5},
      {id:"c5",n:["Online ordering & delivery","الطلب والتوصيل عبر الإنترنت"],d:["Sell through apps or your own site","البيع عبر التطبيقات أو موقعك"],fee:70,days:2},
      {id:"c6",n:["Live music / background music licence","ترخيص الموسيقى الحية والخلفية"],d:["Public performance rights","حقوق الأداء العلني"],fee:60,days:3},
      {id:"c7",n:["Catering for events","تقديم الطعام للفعاليات"],d:["Off-site food service","خدمة الطعام خارج المقهى"],fee:140,days:4}],
    rules:[
      {a:"c2",id:"r1",reg:["Municipal Food Safety Authority","هيئة سلامة الغذاء البلدية"],t:["Hygiene inspection before opening","فحص النظافة قبل الافتتاح"],p:["An inspector visits your shop and checks it is clean and safe for food before you can serve customers.","يزور مفتش محلك ويتأكد من نظافته وسلامته للأغذية قبل أن تبدأ باستقبال الزبائن."],ai:1},
      {a:"c2",id:"r2",reg:["Municipal Food Safety Authority","هيئة سلامة الغذاء البلدية"],t:["Written food-safety plan (HACCP-style)","خطة مكتوبة لسلامة الغذاء (HACCP)"],p:["A short document listing what could go wrong with food and how you prevent it.","وثيقة قصيرة تحدد المخاطر المحتملة على الغذاء وكيف تمنعها."],ai:1},
      {a:"c2",id:"r3",reg:["Health Department","إدارة الصحة"],t:["Food-handler certificates for all kitchen staff","شهادات مناولي الأغذية لجميع العاملين في المطبخ"],p:["Everyone touching food needs a basic course certificate. Valid for 3 years.","كل من يلمس الطعام يحتاج إلى شهادة دورة أساسية، صالحة لمدة 3 سنوات."],ai:0},
      {a:"c1",id:"r4",reg:["Civil Defence","الدفاع المدني"],t:["Fire safety: extinguishers, exits, kitchen hood","السلامة من الحريق: طفايات ومخارج وشفاط المطبخ"],p:["Fire equipment and clear exits must be in place and inspected.","يجب توفير معدات الحريق ومخارج واضحة وإجراء الفحص عليها."],ai:0},
      {a:"c3",id:"r5",reg:["Planning & Zoning","التخطيط والتقسيم"],t:["Premises must be zoned for food service","يجب أن يكون الموقع مخصصًا لخدمات الطعام"],p:["Not every address allows a café. We check the address against the zoning map.","ليس كل عنوان يسمح بمقهى. نتحقق من العنوان على خريطة التقسيم."],ai:1,zone:1},
      {a:"c1",id:"r6",reg:["Consumer Protection","حماية المستهلك"],t:["Price list & allergen information displayed","عرض قائمة الأسعار ومعلومات مسببات الحساسية"],p:["Prices and allergen warnings must be visible to customers.","يجب أن تكون الأسعار وتحذيرات الحساسية ظاهرة للزبائن."],ai:1},
      {a:"c4",id:"r7",reg:["Municipality","البلدية"],t:["Pavement width ≥ 1.5 m after tables placed","عرض الرصيف ≥ 1.5 م بعد وضع الطاولات"],p:["People must still be able to walk past your outdoor tables.","يجب أن يبقى بإمكان المارة تجاوز طاولاتك الخارجية."],ai:1},
      {a:"c6",id:"r8",reg:["Copyright Society","جمعية حقوق المؤلف"],t:["Annual music royalty fee","رسوم سنوية لحقوق الموسيقى"],p:["Playing music publicly requires a yearly licence fee.","تشغيل الموسيقى علنًا يتطلب رسم ترخيص سنوي."],ai:0},
      {a:"c5",id:"r9",reg:["Data Protection","حماية البيانات"],t:["Customer data consent & privacy notice","موافقة بيانات العملاء وإشعار الخصوصية"],p:["If you collect customer details online you need a privacy notice.","إذا جمعت بيانات العملاء عبر الإنترنت فأنت بحاجة إلى إشعار خصوصية."],ai:1}],
    ai:[["Suggest 3 trade names and check availability","اقترح 3 أسماء تجارية وتحقق من توفرها"],["Pre-fill all forms from my ID and company profile","املأ النماذج تلقائيًا من هويتي وملف شركتي"],["Draft my food-safety plan from my menu","اكتب خطة سلامة الغذاء من قائمتي"]]},
  logistics:{ic:"🚚",name:["Open your logistics company","افتح شركتك اللوجستية"],tag:["Freight, last-mile delivery, warehousing","شحن، توصيل الميل الأخير، تخزين"],
    acts:[
      {id:"l1",n:["Road freight transport","نقل البضائع بالطرق البرية"],d:["Goods transport by truck/van","نقل البضائع بالشاحنات"],req:1,fee:420,days:5},

// ---------- AI: intent parsing (scripted stand-in for an LLM call) ----------
function parseIntent(q){
  const l=q.toLowerCase();let best=null,bs=0;
  for(const k in KW){const n=KW[k].filter(w=>l.includes(w)).length;if(n>bs){bs=n;best=k;}}
  if(!best)return null;
  const zone=(Object.keys(ZALIAS).find(z=>ZALIAS[z].some(a=>l.includes(a)))||"");
  const extras=BIZ[best].acts.filter(a=>!a.req&&(XKW[a.id]||[]).some(w=>l.includes(w))).map(a=>a.id);
  return {biz:best,zone,extras};
}
function runIntent(q){
  if(!q.trim())return;
  const r=parseIntent(q);S.intent=r||{none:1};renderIntent();
}
function renderIntent(){
  const e=$("#intent");if(!e)return;const r=S.intent;
  if(!r){e.innerHTML="";return;}
  if(r.none){e.innerHTML=`<b>✨</b> ${_("I couldn't match that to a package yet. Pick one below, or open the Setup Advisor.","لم أتمكن من مطابقة طلبك مع حزمة بعد. اختر حزمة أدناه أو افتح مستشار التأسيس.")}`;return;}
  const bz=BIZ[r.biz];
  e.innerHTML=`<div style="font-weight:600;margin-bottom:6px">✨ ${_("I understood:","فهمت طلبك:")}</div>
  <div class="meta"><span class="chip">${bz.ic} ${x(bz.name)}</span>${r.zone?`<span class="chip">📍 ${x(Z(r.zone).n)}</span>`:`<span class="chip warn">${_("No location yet","لم يُحدد الموقع")}</span>`}${r.extras.map(id=>`<span class="chip ai">+ ${x(bz.acts.find(a=>a.id===id).n)}</span>`).join("")}</div>
  <div style="margin-top:10px"><button class="btn primary" id="igo">${_("Start with this package","ابدأ بهذه الحزمة")} ${fwd()}</button></div>`;
  $("#igo").onclick=()=>pick(r.biz,r.extras,r.zone);
}

      return `<div class="doc"><div class="grow"><div class="t">${s>=2?"✅":s===1?"⚠️":"📎"} ${x(d.n)}</div>${note}</div>${right}</div>`;}).join("")}
    ${devBox("d")}<div class="actions"><button class="btn" id="back">${back()} ${_("Rules","القواعد")}</button><button class="btn primary" id="next">${_("Review & launch","مراجعة وإطلاق")} ${fwd()}</button></div>`;
    m.querySelectorAll("[data-u]").forEach(e=>e.onclick=()=>{const i=e.dataset.u;S.docs[i]=(S.docs[i]||0)===0&&DOCS[i].warn?1:2;renderMain();renderSide();});
    $("#back").onclick=()=>go(2);$("#next").onclick=()=>go(4);return;}
  if(S.step===4){
    if(S.done){m.innerHTML=`<div class="done"><div class="ic">🎉</div><h2>${_("Application submitted","تم إرسال الطلب")}</h2><p class="sub">${_(`Reference DEMO-${S.ref}. Applications are sent to ${S.apps.length} regulators at once and tracked in one place.`,`الرقم المرجعي DEMO-${S.ref}. أُرسلت الطلبات إلى ${S.apps.length} جهات دفعة واحدة وتُتابع في مكان واحد.`)}</p><button class="btn primary" id="trk">${_("Track my business","تتبع عملي")} ${fwd()}</button></div>`;$("#trk").onclick=()=>nav("dash");return;}
    const c=checks(),sc=readiness(c),err=c.some(k=>k.l==="err"),mx=seqDays();
    m.innerHTML=`<h2>${_("Review & launch","مراجعة وإطلاق")}</h2><p class="sub">${x(b().name)} · ${acts().length} ${_("activities","أنشطة")} · ${rules().length} ${_("rules","قواعد")}</p>
    <div class="grid2"><div><div class="group" style="margin-top:0">✨ ${_("AI pre-flight check","فحص الذكاء الاصطناعي قبل الإرسال")}</div><div class="score">${sc}%</div><div class="sub" style="margin:0 0 8px">${_("Readiness score","درجة الجاهزية")}</div>
      ${c.map(k=>`<div class="pf"><span>${k.l==="ok"?"✅":k.l==="warn"?"⚠️":"❌"}</span><div class="grow">${k.t}</div>${k.f?`<button class="btn sm" data-fx="${k.f}">${_("Fix","إصلاح")}</button>`:""}</div>`).join("")}</div>
     <div><div class="group" style="margin-top:0">${_("Time: bundled vs one-by-one","الوقت: الحزمة مقابل واحدًا تلو الآخر")}</div><div class="timeline"><div class="tl"><span style="width:90px">${_("Bundled","الحزمة")}</span><div class="bar" style="width:${parDays()/mx*100}%"></div><span>${parDays()} ${_("d","يوم")}</span></div><div class="tl"><span style="width:90px">${_("Traditional","التقليدي")}</span><div class="bar seq" style="width:100%"></div><span>${mx} ${_("d","يوم")}</span></div></div>
      <div class="group">${_("What gets submitted","ما سيتم إرساله")}</div><table>${acts().map(a=>`<tr><td>${x(a.n)}</td><td style="text-align:end">${a.fee}</td></tr>`).join("")}</table></div></div>
    ${devBox("p")}<div class="actions"><button class="btn" id="back">${back()} ${_("Documents","المستندات")}</button><button class="btn primary" id="go" ${err?"disabled style='opacity:.5'":""}>${err?_("Fix errors to submit","أصلح الأخطاء للإرسال"):_("Submit one application","أرسل طلبًا واحدًا")}</button></div>`;
    m.querySelectorAll("[data-fx]").forEach(e=>e.onclick=()=>go(+e.dataset.fx));
    $("#back").onclick=()=>go(3);$("#go").onclick=()=>{if(err)return;submitApp();renderMain();render();};}
}
function renderSide(){
  const s=$("#side");if(!s)return;let sum="";
  if(S.biz&&S.step>0){const sd=seqDays(),pd=parDays();
    sum=`<div class="card sum"><h3 style="margin:0 0 8px">${b().ic} ${_("Your launch pack","حزمة إطلاقك")}</h3><div><span>${_("Activities","الأنشطة")}</span><b>${acts().length}</b></div><div><span>${_("Rules to meet","القواعد المطلوبة")}</span><b>${rules().length}</b></div><div><span>${_("Est. time (bundled)","الوقت المقدّر (حزمة)")}</span><b>${pd} ${_("days","أيام")}</b></div><div class="big"><span>${_("Gov. fees","الرسوم الحكومية")}</span><b>${fees()}</b></div><div class="save">${_(`⏱ Saves ~${Math.max(0,sd-pd)} days vs one-by-one`,`⏱ يوفّر ~${Math.max(0,sd-pd)} يومًا مقارنة بالتقديم المنفصل`)}</div></div>`;}
  const sugg=S.biz?b().ai:[[_("Which business should I start with a small budget?","أي مشروع أبدأ به بميزانية صغيرة؟")],[_("What do I need to open a café?","ماذا أحتاج لفتح مقهى؟")]];
  s.innerHTML=sum+`<div class="card ai-panel"><h3>${_("✨ AI assistant","✨ المساعد الذكي")}</h3><div class="sugg">${sugg.map((t,i)=>`<button data-i="${i}">${Array.isArray(t)?(t.length>1?x(t):t[0]):t}</button>`).join("")}</div><div class="chat">${S.chat.map(c=>`<div class="msg ${c.u?"u":"a"}">${c.t}</div>`).join("")}</div>
  <div class="field" style="margin:0"><input type="text" id="ci" placeholder="${_("Ask anything…","اسأل أي شيء…")}"><button class="btn primary sm" id="cs">${_("Send","إرسال")}</button></div></div>${devBox("c")}`;
  s.querySelectorAll("[data-i]").forEach(e=>e.onclick=()=>ask(e.textContent,S.biz?+e.dataset.i:-1));
  $("#cs").onclick=()=>ask($("#ci").value,-1);$("#ci").onkeydown=e=>{if(e.key==="Enter")ask(e.target.value,-1);};
}

// ----- Business Map -----
function vMap(){
  const biz=mb(),zid=S.mapZone||(S.biz===biz?S.zone:"")||"",best=bestZone(biz);
  const col={ok:["#d7efe2","#17803d"],cond:["#fbe9cf","#b45309"],no:["#f6d9d9","#b42318"]};
  $("#view").innerHTML=`<div class="wrap pg"><div class="card"><h2>📍 ${_("Business Map","خريطة الأعمال")}</h2><p class="sub">${_("See where each business is allowed, how crowded each zone is, and what AI recommends. Schematic map with sample data.","اعرف أين يُسمح بكل نشاط ومدى ازدحام كل منطقة وما يوصي به الذكاء الاصطناعي. خريطة تخطيطية ببيانات تجريبية.")}</p>
  <div class="tabs" style="margin:0 0 12px">${Object.entries(BIZ).filter(([k,v])=>!v.soon).map(([k,v])=>`<button data-b="${k}" class="btn sm ${biz===k?"primary":""}">${v.ic} ${x(v.name)}</button>`).join("")}</div>
  <div class="mapw"><svg class="map" viewBox="0 0 520 250">${ZONES.map(z=>{const c=col[ZR[biz][z.id]];return `<g data-z="${z.id}"><rect x="${z.x}" y="${z.y}" width="${z.w}" height="${z.h}" rx="12" fill="${c[0]}" stroke="${c[1]}" stroke-width="${zid===z.id?4:1.2}"/><text x="${z.x+z.w/2}" y="${z.y+z.h/2-2}" text-anchor="middle" font-size="14" font-weight="700" fill="#14213D">${x(z.n)}</text><text x="${z.x+z.w/2}" y="${z.y+z.h/2+18}" text-anchor="middle" font-size="12" fill="#14213D">${COMP[biz][z.id]} ${_("similar","مشابهة")}</text>${best.id===z.id?`<text x="${z.x+10}" y="${z.y+22}" font-size="16">⭐</text>`:""}</g>`;}).join("")}</svg>
  <div class="zinfo" id="zi"></div></div>
  <div class="tabs" style="margin-top:10px;color:var(--muted);align-items:center"><span class="st ok">${x(STN.ok)}</span><span class="st cond">${x(STN.cond)}</span><span class="st no">${x(STN.no)}</span><span>⭐ ${_("AI recommended","موصى به من الذكاء الاصطناعي")}</span></div>${devBox("m")}</div></div>`;
  document.querySelectorAll("[data-b]").forEach(e=>e.onclick=()=>{S.mapBiz=e.dataset.b;S.mapZone=null;vMap();});
  document.querySelectorAll("[data-z]").forEach(e=>e.onclick=()=>{S.mapZone=e.dataset.z;vMap();});
  const zi=$("#zi");
  if(!zid){zi.innerHTML=`<div class="expl" style="margin:0"><b>${_("✨ AI recommendation:","✨ توصية الذكاء الاصطناعي:")}</b> ${_(`For ${x(BIZ[biz].name).toLowerCase()}, ${x(best.n)} looks best: allowed, ${COMP[biz][best.id]} similar businesses and traffic ${best.tr}/5.`,`لـ«${x(BIZ[biz].name)}» تبدو ${x(best.n)} الأفضل: مسموحة و${COMP[biz][best.id]} أعمال مشابهة وحركة ${best.tr}/5.`)}</div><p class="sub" style="margin-top:10px">${_("Tap a zone for details.","اضغط على منطقة لعرض التفاصيل.")}</p>`;return;}
  const z=Z(zid),stt=ZR[biz][zid],n=COMP[biz][zid];
  zi.innerHTML=`<b>${x(z.n)}</b> <span class="st ${stt}">${x(STN[stt])}</span><div class="d" style="margin:8px 0">${n} ${_("similar businesses","أعمال مشابهة")} · ${_("competition","المنافسة")}: ${x(LVN[lvl(n)])}<br>${_("Foot traffic","حركة المشاة")}: ${"★".repeat(z.tr)}${"☆".repeat(5-z.tr)}</div>
  <div class="expl" style="margin:0 0 10px"><b>${_("✨ AI says:","✨ يقول الذكاء الاصطناعي:")}</b> ${stt==="ok"?_(`You can open here. ${lvl(n)===2?"Competition is high, so differentiate.":"Competition level is manageable."}`,`يمكنك الافتتاح هنا. ${lvl(n)===2?"المنافسة مرتفعة فميّز نفسك.":"مستوى المنافسة مقبول."}`):_(`Not straightforward here. Consider ${x(best.n)} instead.`,`الأمر ليس بسيطًا هنا. فكّر في ${x(best.n)} بدلًا منها.`)}</div>
  ${S.biz===biz?`<button class="btn primary" id="uz">${_("Use this location","استخدم هذا الموقع")}</button>`:`<button class="btn" id="stbiz">${_("Start this business here","ابدأ هذا العمل هنا")} ${fwd()}</button>`}`;
  const u=$("#uz");if(u)u.onclick=()=>{S.zone=zid;zoneApply();S.step=2;nav("start");toast(_("Location saved to your application","تم حفظ الموقع في طلبك"));};
  const sb=$("#stbiz");if(sb)sb.onclick=()=>pick(biz,[],zid);
}

// ----- My Business -----
function vDash(){
  if(!S.apps.length){$("#view").innerHTML=`<div class="wrap pg"><div class="card done"><div class="ic">🗂</div><h2>${_("No applications yet","لا توجد طلبات بعد")}</h2><p class="sub">${_("Submit a business package and track every regulator here.","أرسل حزمة أعمال وتابع كل جهة من هنا.")}</p><button class="btn primary" id="st">${_("Start a business","ابدأ عملًا")} ${fwd()}</button></div></div>`;$("#st").onclick=()=>nav("start");return;}
  const L=S.apps.map(a=>({a,s:st(a)})),avg=Math.round(100*L.reduce((t,k)=>t+k.s.p,0)/L.length),ac=L.filter(k=>k.s.s==="action"),left=Math.max(...L.map(k=>Math.max(0,k.a.dur-S.day)))+(ac.length?2:0);
  const eta=new Date(Date.now()+left*864e5),bz=BIZ[S.apps[0].biz];
  const nxt=ac.length?_(`Fix “${x(DOCS[ac[0].a.doc].n)}” for ${x(ac[0].a.reg)}. It is the only thing blocking your launch.`,`أصلح «${x(DOCS[ac[0].a.doc].n)}» لدى ${x(ac[0].a.reg)}. هذا هو الشيء الوحيد الذي يعطّل إطلاقك.`):avg>=100?_("Everything is approved. Open your doors 🎉","تمت الموافقة على كل شيء. يمكنك الافتتاح 🎉"):_("Nothing needs you right now. We'll notify you if a regulator asks for something.","لا شيء يتطلب منك الآن. سنخطرك إذا طلبت أي جهة شيئًا.");
  $("#view").innerHTML=`<div class="wrap pg"><div class="grid2"><div class="card"><h2>${bz.ic} ${x(bz.name)}</h2><div class="score">${avg}%</div><div class="pbar"><i style="width:${avg}%"></i></div>
   <div class="sub">${_("Expected completion","الإنجاز المتوقع")}: <b>${fmt(eta)}</b> (${left} ${_("days","أيام")})</div>
   <div class="expl" style="margin-top:12px"><b>${_("✨ Next best action:","✨ أفضل خطوة تالية:")}</b> ${nxt}</div>
   <div class="actions"><button class="btn" id="rs">${_("Reset demo","إعادة تعيين")}</button><button class="btn primary" id="sim">⏩ ${_("Simulate +3 days","محاكاة +3 أيام")}</button></div></div>
  <div class="card"><h3 style="margin:0 0 8px">🔔 ${_("Renewal reminders (AI)","تنبيهات التجديد (ذكاء اصطناعي)")}</h3>${bz.renew.map(r=>`<div class="row"><div class="grow"><div class="t">${x(r[0])}</div><div class="d">${_(`Renews ${r[1]} months after approval. We'll remind you 30 days before and prepare the paperwork.`,`يُجدَّد بعد ${r[1]} شهرًا من الموافقة. سنذكّرك قبل 30 يومًا ونجهّز الأوراق.`)}</div></div></div>`).join("")}</div></div>
  <div class="card" style="margin-top:14px"><h3 style="margin:0 0 8px">${_("Applications by regulator","الطلبات حسب الجهة")}</h3>${L.map(({a,s},i)=>`<div class="row"><div class="grow"><div class="t">${x(a.reg)}</div><div class="d">${s.s==="action"?"⚠️ "+_("Action needed","مطلوب إجراء"):x(STG[s.i])}</div><div class="dots">${[0,1,2,3].map(j=>`<i class="${s.s==="action"&&j===1?"w":j<=s.i&&s.s!=="sub"||j===0?"f":""}"></i>`).join("")}</div></div>${s.s==="action"?`<button class="btn primary sm" data-f="${i}">${_("Fix now","أصلح الآن")}</button>`:""}</div>`).join("")}</div>${devBox("t")}</div>`;
  $("#sim").onclick=()=>{S.day+=3;const n=actionCount();render();if(n)toast(_("⚠️ A regulator needs something from you","⚠️ هناك جهة تحتاج منك إجراءً"));};
  $("#rs").onclick=()=>{S.apps=[];S.done=false;S.day=0;render();};
  document.querySelectorAll("[data-f]").forEach(e=>e.onclick=()=>openFix(+e.dataset.f));
}
render();
</script>
