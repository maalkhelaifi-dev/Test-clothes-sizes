# Optional: regenerate the Xcode project with XcodeGen (https://github.com/yonaskolb/XcodeGen)
#   brew install xcodegen && xcodegen generate
# The committed MeasureMe.xcodeproj is equivalent (generated by scripts/generate_xcodeproj.py).
name: MeasureMe
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
packages:
  MeasureMeKit:
    path: MeasureMeKit
targets:
  MeasureMe:
    type: application
    platform: iOS
    sources:
      - MeasureMe
    dependencies:
      - package: MeasureMeKit
        product: MeasureMeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.MeasureMe
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Measure Me
        INFOPLIST_KEY_NSCameraUsageDescription: Measure Me uses the camera to estimate your body measurements on this iPhone. Photos are processed on-device and are not uploaded.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
schemes:
  MeasureMe:
    build:
      targets:
        MeasureMe: all
    test:
      targets:
        - package: MeasureMeKit/MeasureMeCoreTests
