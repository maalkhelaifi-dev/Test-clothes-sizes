name: Screenshots

# Builds the app, runs it in the iOS Simulator in debug screenshot mode
# (sample data, `-screenshotScene <name>`) and commits PNGs to docs/screenshots.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build for Simulator (Debug)
        run: |
          xcodebuild build -project MeasureMe.xcodeproj -scheme MeasureMe -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO | tail -5
      - name: Capture screenshots
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          c = [x for r, v in sorted(d.items()) if 'iOS' in r for x in v if x['name'].startswith('iPhone') and 'Pro' in x['name'] and 'Max' not in x['name']]
          print(c[-1]['udid'])")
          echo "Simulator: $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          APP=$(find build/Build/Products -name MeasureMe.app -path '*iphonesimulator*' | head -1)
          xcrun simctl install "$UDID" "$APP"
          mkdir -p docs/screenshots
          for s in welcome privacy consent profiles profileEditor profileDetail category setup capture results recommendation charts chartDetail chartEditor history settings; do
            xcrun simctl launch --terminate-running-process "$UDID" com.example.MeasureMe -screenshotScene "$s"
            sleep 6
            xcrun simctl io "$UDID" screenshot "docs/screenshots/$s.png"
          done
          ls -la docs/screenshots
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "Update app screenshots [skip ci]" || echo "No changes"
          git push origin HEAD:${{ github.ref_name }}
